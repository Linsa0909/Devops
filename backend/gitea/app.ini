# Gitea 配置文件
APP_NAME = AgentDev OS
RUN_MODE = prod
RUN_USER = root

[server]
DOMAIN           = localhost
SSH_DOMAIN       = localhost
HTTP_PORT        = 3000
ROOT_URL         = http://localhost:3000/
DISABLE_SSH      = true
OFFLINE_MODE     = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH    = ./gitea.db

[repository]
ROOT = ./repos
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG  = true
DEFAULT_PUSH_CREATE_PRIVATE = false

[security]
INSTALL_LOCK   = true
SECRET_KEY     = agentdev-os-local-dev-key-2024
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiJ9.agentdev-internal-token

[log]
MODE = console
LEVEL = WARN
